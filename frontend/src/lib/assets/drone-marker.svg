<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="64" height="64" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="stealthBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e36" />
      <stop offset="40%" stop-color="#191b20" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>

    <linearGradient id="armBlade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121417" />
      <stop offset="50%" stop-color="#303540" />
      <stop offset="100%" stop-color="#0c0d0f" />
    </linearGradient>

    <radialGradient id="bladeBlur" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b0d0ff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#60a0ff" stop-opacity="0.2" />
      <stop offset="85%" stop-color="#2058c0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1030a0" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="redCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="50%" stop-color="#cc0000" />
      <stop offset="100%" stop-color="#330000" />
    </radialGradient>

    <filter id="threatGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <g filter="url(#heavyShadow)">
    <path d="M 34 32 L 41 30 L 58 51 L 94 96 L 87 98 L 70 77 Z" fill="url(#armBlade)" stroke="#0d0e10" stroke-width="0.5" />
    <path d="M 94 32 L 87 30 L 70 51 L 34 96 L 41 98 L 58 77 Z" fill="url(#armBlade)" stroke="#0d0e10" stroke-width="0.5" />

    <g transform="translate(35, 30)">
      <circle cx="0" cy="0" r="19" fill="url(#bladeBlur)" />
      <circle cx="0" cy="0" r="19" fill="none" stroke="#2a7dff" stroke-width="3" opacity="1" />
      <polygon points="0,-3.5 3,-1.7 3,1.7 0,3.5 -3,1.7 -3,-1.7" fill="#15171a" stroke="#333842" stroke-width="0.5" />
      <circle cx="0" cy="0" r="1" fill="#66b3ff" fill-opacity="0.9" />
      <circle cx="0" cy="-4.5" r="0.8" fill="#66b3ff" fill-opacity="0.7" filter="url(#threatGlow)" />
    </g>

    <g transform="translate(93, 30)">
      <circle cx="0" cy="0" r="19" fill="url(#bladeBlur)" />
      <circle cx="0" cy="0" r="19" fill="none" stroke="#2a7dff" stroke-width="3" opacity="1" />
      <polygon points="0,-3.5 3,-1.7 3,1.7 0,3.5 -3,1.7 -3,-1.7" fill="#15171a" stroke="#333842" stroke-width="0.5" />
      <circle cx="0" cy="0" r="1" fill="#66b3ff" fill-opacity="0.9" />
      <circle cx="0" cy="-4.5" r="0.8" fill="#66b3ff" fill-opacity="0.7" filter="url(#threatGlow)" />
    </g>

    <g transform="translate(35, 98)">
      <circle cx="0" cy="0" r="19" fill="url(#bladeBlur)" />
      <circle cx="0" cy="0" r="19" fill="none" stroke="#2a7dff" stroke-width="3" opacity="1" />
      <polygon points="0,-3.5 3,-1.7 3,1.7 0,3.5 -3,1.7 -3,-1.7" fill="#15171a" stroke="#333842" stroke-width="0.5" />
      <circle cx="0" cy="0" r="1" fill="#66b3ff" fill-opacity="0.9" />
      <circle cx="0" cy="4.5" r="0.8" fill="#66b3ff" fill-opacity="0.7" filter="url(#threatGlow)" />
    </g>

    <g transform="translate(93, 98)">
      <circle cx="0" cy="0" r="19" fill="url(#bladeBlur)" />
      <circle cx="0" cy="0" r="19" fill="none" stroke="#2a7dff" stroke-width="3" opacity="1" />
      <polygon points="0,-3.5 3,-1.7 3,1.7 0,3.5 -3,1.7 -3,-1.7" fill="#15171a" stroke="#333842" stroke-width="0.5" />
      <circle cx="0" cy="0" r="1" fill="#66b3ff" fill-opacity="0.9" />
      <circle cx="0" cy="4.5" r="0.8" fill="#66b3ff" fill-opacity="0.7" filter="url(#threatGlow)" />
    </g>

    <polygon points="64,25 66,37 62,37" fill="#111317" stroke="#ff1a1a" stroke-width="0.5" />
    <path d="M 64 27 
             L 68 37 
             L 67 50 
             L 70 59 
             L 66 77 
             L 68 93 
             L 64 101 
             L 60 93 
             L 62 77 
             L 58 59 
             L 61 50 
             L 60 37 Z"
          fill="url(#stealthBody)"
          stroke="#454d5e"
          stroke-width="0.6" />

    <path d="M 64 38 
             L 66 45 
             L 65 58 
             L 67 75 
             L 64 90 
             L 61 75 
             L 63 58 
             L 62 45 Z"
          fill="#111215"
          stroke="#272b35"
          stroke-width="0.4" />

    <polygon points="64,54 67,58 64,62 61,58" fill="#0a0b0d" stroke="#3d4452" stroke-width="0.5" />
    <polygon points="64,55 66,58 64,61 62,58" fill="url(#redCore)" filter="url(#threatGlow)" />
    <circle cx="64" cy="58" r="0.6" fill="#ffffff" />

    <polygon points="59,40 56,42 58,43" fill="#00f0ff" filter="url(#cyanGlow)" />
    <polygon points="69,40 72,42 70,43" fill="#00f0ff" filter="url(#cyanGlow)" />

    <polygon points="61,91 59,95 62,93" fill="#ff0000" filter="url(#threatGlow)" />
    <polygon points="67,91 69,95 66,93" fill="#ff0000" filter="url(#threatGlow)" />

    <path d="M 64 39 L 65 42 L 64 41 L 63 42 Z" fill="#ff1a1a" filter="url(#threatGlow)" />
  </g>
</svg>